services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PATCHPILOT_MODEL=${PATCHPILOT_MODEL:-openai/gpt-oss-120b}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-6}
      - TEST_TIMEOUT_SECONDS=${TEST_TIMEOUT_SECONDS:-30}
      - MAX_RUN_DURATION_SECONDS=${MAX_RUN_DURATION_SECONDS:-300}
      - LLM_REQUEST_TIMEOUT_SECONDS=${LLM_REQUEST_TIMEOUT_SECONDS:-90}
      - RUNS_DIR=runs
    volumes:
      - ./runs:/app/runs
      - ./eval/results:/app/eval/results

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
